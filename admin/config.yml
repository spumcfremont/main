backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Pastor's Corner Posts"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string", default: "Pastor Rajiv" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on the Pastor's Corner list page and in the RSS feed." }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["post"] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "ministries"
    label: "Ministries & Small Groups"
    folder: "src/ministries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Kicker (subtitle)", name: "kicker", widget: "string" }
      - label: "Accent color"
        name: "accent"
        widget: "select"
        options: &accent_options
          - { label: "Purple", value: "p" }
          - { label: "Orange (Flame)", value: "f" }
          - { label: "Gold", value: "y" }
          - { label: "Red (Crimson)", value: "c" }
          - { label: "Blue", value: "b" }
          - { label: "Green", value: "g" }
        default: "p"
      - { label: "Order", name: "order", widget: "number", hint: "Lower numbers show first.", value_type: "int" }
      - { label: "Contact info", name: "contact", widget: "string", required: false, hint: "e.g. \"Jane Doe · (510) 555-1234\" — you can add a phone link like [(510) 555-1234](tel:15105551234)" }
      - { label: "Button label", name: "cta_label", widget: "string", required: false, hint: "Only needed for a card with a button, like \"Give online\"" }
      - { label: "Button link", name: "cta_url", widget: "string", required: false }
      - { label: "Anchor ID", name: "anchor", widget: "hidden", required: false }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["ministry"] }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write a bulleted schedule list, a short paragraph, or both." }

  - name: "outreach"
    label: "Outreach, Mission & Justice"
    folder: "src/outreach"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Kicker (subtitle)", name: "kicker", widget: "string" }
      - { label: "Accent color", name: "accent", widget: "select", options: *accent_options, default: "p" }
      - { label: "Order", name: "order", widget: "number", hint: "Lower numbers show first.", value_type: "int" }
      - { label: "Contact info", name: "contact", widget: "string", required: false, hint: "e.g. \"Jane Doe · (510) 555-1234\" — you can add a phone link like [(510) 555-1234](tel:15105551234)" }
      - { label: "Button label", name: "cta_label", widget: "string", required: false, hint: "Only needed for a card with a button, like \"Give online\"" }
      - { label: "Button link", name: "cta_url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["outreach"] }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write a bulleted schedule list, a short paragraph, or both." }

  - name: "seasonal_features"
    label: "Homepage Feature Banners"
    folder: "src/seasonal-features"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/season-detail.njk" }
      - { label: "Active", name: "active", widget: "boolean", default: false, hint: "Show this banner near the top of the homepage. Any number can be active at once (e.g. Christmas Cantata and Christmas Eve Service both showing in December) — they'll stack in Order below." }
      - { label: "Order", name: "order", widget: "number", default: 1, hint: "When more than one is active at once, lower numbers show first.", value_type: "int" }
      - { label: "Title", name: "title", widget: "string", hint: "The big headline — shows on the homepage card and its own page." }
      - { label: "Short summary", name: "summary", widget: "text", hint: "1–2 sentences shown on the homepage card, like a teaser." }
      - { label: "Full details", name: "body", widget: "markdown", hint: "Paste a photo right at the top of this box if you have one — it'll show on the homepage card and the details page automatically. Then write everything else — dates, times, program info, links, whatever you like. This shows on the feature's own page when someone clicks \"More details.\" You can type or paste links directly into this text; there's no separate link field to fill in." }
      - { label: "Tags", name: "tags", widget: "hidden", default: ["seasonal-feature"] }
